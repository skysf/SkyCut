# 每个 PR（以及合并进 main 后）跑全部自检：scripts/check-all.sh。
# main 禁直推、必须走 PR —— 在这个闸口挂检查，「合并前必绿」就不靠自觉了。
#
# 仓库是公开的，GitHub 托管的 macOS runner 免费（免费档同时最多 5 台 macOS）。所以
# check-all 按 `shard` 拆成 5 组，分到 5 台 runner 上并行跑，最后由一个叫 check-all 的
# 汇总 job 给结论（ruleset protect-main 要求的就是这个名字）。分组、耗时与取舍见
# docs/build/build-and-packaging.md「CI」一节。
#
# vendor/ffmpeg 不入库（见 .gitignore），按 vendor-ffmpeg.sh 的内容做缓存键：
# 脚本没变（上游 URL/校验值没变）就复用缓存，变了才重新下载。
name: checks

on:
  pull_request:
  push:
    branches: [main]

# 同一个 PR 又推了新提交，旧的那一轮直接取消：macOS runner 免费但同时只有 5 台，
# 别让作废的一轮占着。main 上的每一次都跑完（按提交分组，不会互相取消）。
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 合并之后 main 上那一轮要读本仓库的 artifact 和运行记录（scripts/ci-verified-tree.sh），所以 token 要有 actions: read。
# 这里写了 permissions，没列出来的权限就都没有了：两个 job 用到的只有读代码这一项。
permissions:
  contents: read
  actions: read

jobs:
  shard:
    name: shard ${{ matrix.shard }}/5
    # 必须 macos-26：字幕生成用了 macOS 26 的 SpeechAnalyzer API，
    # macos-15 镜像默认 Xcode 16（SDK 15）编不过完整 app target ——
    # 首跑 6 项齐红就是它（SrtFlowCore 不碰这些 API 所以核心检查过了）。
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      # 一组红了别的组照跑完：一次看全所有失败。
      fail-fast: false
      matrix:
        # 组数改了要同步 scripts/check-all.sh 里的 `shard N` 声明 —— 对不上它会直接红。
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          # 预览性能 ratchet 要拿「这个 PR 之前」的基线来比（只许降），PR 的合并提交
          # 得带上它的父提交。
          fetch-depth: 2

      # 顺带给 .build 缓存算一个工具链指纹：Xcode / Swift 一换，恢复回来的 .build 就不能用了（换了编译器 SwiftPM 本来就
      # 全部重编，还白下载一遍），所以指纹进缓存的 key。
      - name: Toolchain versions (diagnostics)
        id: toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          sysctl -n hw.ncpu
          echo "id=$({ xcodebuild -version; swift --version; } 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # 只改了文档（白名单和理由见 scripts/ci-docs-only.sh）：不编 App、不跑自检，第 1 组跑一遍扫描守卫就收工，
      # 其余四组到这里就绿了。下面每一步都带 `steps.changes.outputs.docs_only != 'true'`：这一步出了任何岔子
      #（没输出、输出不是 true）都照常全跑，宁可多跑不许漏跑。checks/ci-docs-only.sh 钉着。
      - name: Classify changes (docs only?)
        id: changes
        run: echo "docs_only=$(scripts/ci-docs-only.sh)" >> "$GITHUB_OUTPUT"

      # 合并之后 main 上这一轮：合出来的树和这个 PR 最后一次绿的那一轮测的树一模一样时（那一轮在汇总 job 里留了记号，
      # 见下面的 check-all），这棵树已经原样验过，不再跑检查：第 1 组只编一遍 App、把 .build 缓存存下来给下一个 PR 用，
      # 其余四组到这里就绿了。PR 上永远是 false。和上一步同一个写法：下面每一步都写成 `verified != 'true'`，这一步
      # 出了任何岔子（查不到、接口出错、记号过期、输出不是 true）都照常全跑。checks/ci-verified-tree.sh 钉着；
      # 关掉它不用改代码：把仓库变量 CI_VERIFIED_TREE 设成 off。docs/build/build-and-packaging.md「CI」一节。
      - name: Already verified? (main only, same tree as the pull request's green run)
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_TREE_SWITCH: ${{ vars.CI_VERIFIED_TREE }}
        run: echo "verified=$(scripts/ci-verified-tree.sh)" >> "$GITHUB_OUTPUT"

      - name: Scan guards only (docs-only change)
        if: steps.changes.outputs.docs_only == 'true' && steps.verified.outputs.verified != 'true' && matrix.shard == 1
        run: scripts/check-guards.sh

      # .build 缓存（docs/bugfixes/2026-11-04-ci-build-cache-never-saved-a-compile.md）：
      # - 先把入库文件的修改时间按内容设好。SwiftPM 看修改时间「和上次记下的一不一样」决定重不重编，checkout 出来的时间
      #   每次都是新的，不设的话恢复回来的 .build 一个文件都用不上（以前就是这样：整个 App 每次冷编）。
      # - 每组一份（各组编的东西不一样；以前五组抢一个 key，谁先跑完谁存，存下的是只编了核心库的那一组）。key 带工具链指纹
      #   和这次的提交，restore-keys 去掉提交：恢复同一组、同一工具链最新的那一份。
      # - 只在 main 上、整组绿了才存（PR 上存的只有这个 PR 自己用得上）；PR 恢复 main 上最新的那一份。
      # - .build 里的模块缓存记着检出目录的绝对路径，换了目录恢复回来就编不过，所以 key 带检出目录
      #   （docs/bugfixes/2026-10-18-ci-build-cache-breaks-after-repo-rename.md）。checks/ci-build-cache-key.sh 钉着这些；
      #   「按内容设的时间比上次编译还早时照样重编」由 scripts/check-ci-build-cache.sh 每次真验一遍。
      - name: Stable file times (content-derived)
        if: steps.changes.outputs.docs_only != 'true' && (steps.verified.outputs.verified != 'true' || matrix.shard == 1)
        run: python3 scripts/ci-stable-mtimes.py

      - name: Restore SwiftPM build products
        if: steps.changes.outputs.docs_only != 'true' && (steps.verified.outputs.verified != 'true' || matrix.shard == 1)
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ github.workspace }}-${{ steps.toolchain.outputs.id }}-shard${{ matrix.shard }}-${{ github.sha }}
          restore-keys: swiftpm-${{ runner.os }}-${{ github.workspace }}-${{ steps.toolchain.outputs.id }}-shard${{ matrix.shard }}-

      # 已经验过的那种轮里第 1 组照样过一遍这两步（命中只要 2 秒）：PR 上存的缓存别的 PR 取不到，改了 vendor-ffmpeg.sh
      # 的那次合并之后，要靠 main 上这一轮把新的 ffmpeg 存进大家都取得到的那一份。
      - name: Cache vendor/ffmpeg
        if: steps.changes.outputs.docs_only != 'true' && (steps.verified.outputs.verified != 'true' || matrix.shard == 1)
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ffmpeg-${{ hashFiles('scripts/vendor-ffmpeg.sh') }}

      - name: Fetch ffmpeg (on cache miss)
        if: steps.changes.outputs.docs_only != 'true' && (steps.verified.outputs.verified != 'true' || matrix.shard == 1) && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/vendor-ffmpeg.sh

      # 只在第 1 组单独编一遍完整 App：编译错误在自己的步骤里完整可见；恢复了 main 上的缓存就只编改了的那些。
      # 其余几组的子脚本只编核心库（它们只要 SrtFlowCore 的模块和目标文件），
      # 不必每台都花几分钟编整个 App。
      - name: Build app (errors visible here)
        if: steps.changes.outputs.docs_only != 'true' && matrix.shard == 1
        run: swift build --arch arm64

      - name: Run checks (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        if: steps.changes.outputs.docs_only != 'true' && steps.verified.outputs.verified != 'true'
        run: scripts/check-all.sh --shard ${{ matrix.shard }} --of ${{ strategy.job-total }}

      # 预览性能 ratchet：起真 App 按固定场景数「做了多少件活」，只许降不许涨
      # （docs/architecture/preview-perf-ratchet.md）。要图形会话，所以不在 check-all.sh 里；
      # 放第 1 组是因为这台已经编好了完整 App。上一步红了它照跑：一次看全。
      - name: Preview performance ratchet
        if: ${{ !cancelled() && matrix.shard == 1 && steps.changes.outputs.docs_only != 'true' && steps.verified.outputs.verified != 'true' }}
        env:
          PREVIEW_PERF_OUT: ${{ runner.temp }}/preview-perf
        run: scripts/check-preview-perf.sh

      - name: Upload preview performance results
        if: ${{ !cancelled() && matrix.shard == 1 && steps.changes.outputs.docs_only != 'true' && steps.verified.outputs.verified != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-perf
          path: ${{ runner.temp }}/preview-perf
          if-no-files-found: ignore

      - name: Save SwiftPM build products (main only)
        if: github.event_name == 'push' && success() && steps.changes.outputs.docs_only != 'true' && (steps.verified.outputs.verified != 'true' || matrix.shard == 1)
        uses: actions/cache/save@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ github.workspace }}-${{ steps.toolchain.outputs.id }}-shard${{ matrix.shard }}-${{ github.sha }}

  check-all:
    # ruleset protect-main 要求一个叫 check-all 的检查通过，由这里汇总 5 组的结果。
    # 分组红了这里也必须跑出一个「失败」：不写 if 的话它会因为 needs 失败而被跳过，
    # 而被跳过的必需检查会被 GitHub 当成通过 —— 红的 PR 也能合进去。
    # 用 !cancelled() 而不是 always()：被新提交取消掉的那一轮不用再报一个假的失败。
    needs: shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js for website checks
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Test and build the website
        working-directory: website
        run: |
          npm ci
          npm test
          npm run build
          npm run check:seo
      - name: All shards passed
        run: |
          echo "shards: ${{ needs.shard.result }}"
          test "${{ needs.shard.result }}" = "success"

      # 记号：PR 的这一轮全绿（上面每一步都过了才走得到这里）之后，留一个名字里带着「这一轮检出的那棵树」的 artifact。
      # 合并之后 main 上那一轮拿自己的树去找它（scripts/ci-verified-tree.sh），认的不是这个文件，是 GitHub 对上传它的
      # 那一轮的记录（是不是本仓库 checks.yml 的 pull_request 绿轮、是不是这个 PR 的头提交）。只留一天；两步都是
      # continue-on-error：留不下记号只会让 main 上那一轮照常全跑，不许让必需的 check-all 因此变红。
      - name: Name the verified tree
        id: tree
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          printf '%s\n' "${tree}" > "${RUNNER_TEMP}/verified-tree.txt"
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
      - name: Leave the verified-tree marker
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: verified-tree-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/verified-tree.txt
          retention-days: 1
          overwrite: true
